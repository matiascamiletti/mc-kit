<mc-page-title [pretitle]="'MC Kit'" [title]="'Odata Grid Page'" [subtitle]="'Ejemplo de uso de Odata Grid Page'">
    <div actions>
        <button>Open Modal</button>
    </div>
</mc-page-title>

<div class="mt-2"></div>

<mc-odata-grid-page #odataPage [breadcrumb]="breadcrumb" [title]="'Users'"
    [subtitle]="'Listado de usuarios para administrarlos, usted puede editar, borrar y actualizar.'" [key]="'users'"
    [httpService]="testService" [filters]="filters" [columns]="columns" [searchFieldsKey]="searchFieldsKey">

    <ng-template mcRightHeaderTemplate>
        <p-button label="New" styleClass="w-full md:ml-3 md:auto mt-3 md:mt-0" />
    </ng-template>

    <ng-template mcThTemplate="check">
        <p-checkbox [binary]="true" />
    </ng-template>

    <ng-template mcThTemplate="game_number">
        <h2>Game Test Head # <p-button label="send" /></h2>
    </ng-template>

    <ng-template mcTdTemplate="status" let-row>
        <p-button label="Change status" /> {{ row.status }}
    </ng-template>

    <ng-template mcTdTemplate="check" let-row>
        <p-checkbox [binary]="true" />
    </ng-template>

    <ng-template mcTdTemplate="actions" let-row>
        <mc-actions-column [item]="row" (onEdit)="onClickEdit($event)"
            (onRemove)="onClickRemove($event)"></mc-actions-column>
    </ng-template>


    <ng-template mcItemGridTemplate let-row>
        <p-card>
            <h1>Title:</h1>
            {{row.game_number}}
        </p-card>

    </ng-template>

</mc-odata-grid-page>
