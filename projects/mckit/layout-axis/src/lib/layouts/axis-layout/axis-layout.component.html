<div id="mc-axis-layout" class="mc-axis-layout layout-wrapper flex h-screen w-full overflow-hidden">
  <!-- Sidebar -->
  <aside
    class="layout-sidebar mc-axis-sidebar fixed inset-y-0 left-0 z-30 w-full h-full md:relative flex-shrink-0 overflow-y-auto overflow-x-hidden"
    [class.open]="isOpen()">
    <div class="layout-sidebar-close-button absolute right-2 top-2 md:hidden z-10">
      <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="secondary" ariaLabel="Close menu"
        (onClick)="closeSidebar()" />
    </div>
    <div class="mc-axis-sidebar-content w-full min-h-full flex flex-col">
      <mc-print-service [id]="sidebarId"></mc-print-service>
    </div>
  </aside>
  <!-- END Sidebar -->

  @if (isOpen()) {
    <div class="layout-sidebar-overlay md:hidden fixed inset-0 z-20 bg-black/50 transition-opacity" aria-hidden="true"
      (click)="closeSidebar()"></div>
  }

  <div
    class="layout-main-container mc-axis-main-container relative flex-1 flex flex-col h-full min-w-0 overflow-y-auto w-full transition-all duration-300"
    [class.without-sidebar]="!isOpen()">
    <!-- Topbar -->
    <header
      class="layout-topbar mc-axis-topbar w-full flex-shrink-0 flex justify-between items-center gap-4 px-4 md:px-6 sticky top-0 z-10">
      <div class="p-toolbar-group-start mc-axis-topbar-start h-full flex items-center min-w-0">
        <mc-print-service [id]="topbarLeftId" [isFlexRow]="true" [classes]="'items-center gap-3'"></mc-print-service>
      </div>
      <div class="p-toolbar-group-center mc-axis-topbar-center h-full hidden md:flex flex-1 items-center justify-center min-w-0">
        <mc-print-service [id]="topbarCenterId" [isFlexRow]="true" [classes]="'items-center gap-3'"></mc-print-service>
      </div>
      <div class="p-toolbar-group-end mc-axis-topbar-end layout-topbar-menu h-full flex items-center">
        <mc-print-service [id]="topbarRightId" [isFlexRow]="true" [classes]="'items-center gap-3'"></mc-print-service>
      </div>
    </header>
    <!-- END Topbar -->

    <main class="layout-main mc-axis-main w-full flex-1 relative flex flex-col" [class.open]="isOpen()">
      @if (isRouteLoading()) {
        <div
          class="route-loading-overlay absolute inset-0 z-50 flex items-center justify-center bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm">
          <p-progressSpinner ariaLabel="loading" strokeWidth="4" />
        </div>
      }
      <div class="mc-axis-content w-full mx-auto flex-1 flex flex-col p-4 md:p-6">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Footer -->
    <footer class="layout-footer mc-axis-footer w-full flex flex-shrink-0 justify-center mt-auto">
      <mc-print-service [id]="footerId"></mc-print-service>
    </footer>
    <!-- END Footer -->
  </div>
</div>
