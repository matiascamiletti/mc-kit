<div
  class="w-full bg-white dark:bg-zinc-900 border-t-2 md:border-t-[3px] border-t-[#4A72A4] dark:border-t-blue-500 border-x border-b border-slate-200/90 dark:border-zinc-800 rounded-2xl md:rounded-3xl shadow-sm overflow-hidden flex flex-col transition-all duration-200"
  [class]="customClass()"
>
  <!-- Card Header -->
  <div class="flex items-center justify-between gap-4 px-6 pt-5 pb-3 sm:px-8 sm:pt-6">
    <!-- Left: Title / Label -->
    <div class="flex items-center gap-2 min-w-0">
      <ng-content select="[card-header-left], [header-left], [title]">
        @if (title()) {
          <span class="text-xs sm:text-sm font-bold tracking-wider text-[#4A72A4] dark:text-blue-400 uppercase truncate">
            {{ title() }}
          </span>
        }
      </ng-content>
    </div>

    <!-- Right: Action / Link -->
    <div class="flex items-center flex-shrink-0">
      <ng-content select="[card-header-right], [header-right], [action]">
        @if (actionText()) {
          @if (actionUrl()) {
            <a
              [routerLink]="actionUrl()"
              [target]="actionTarget()"
              (click)="onActionClick($event)"
              class="group inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-[#4A72A4] hover:text-[#335684] dark:text-blue-400 dark:hover:text-blue-300 transition-colors"
            >
              <span>{{ actionText() }}</span>
              <svg
                class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-1"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>
          } @else {
            <button
              type="button"
              (click)="onActionClick($event)"
              class="group inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-[#4A72A4] hover:text-[#335684] dark:text-blue-400 dark:hover:text-blue-300 transition-colors cursor-pointer"
            >
              <span>{{ actionText() }}</span>
              <svg
                class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-1"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </button>
          }
        }
      </ng-content>
    </div>
  </div>

  <!-- Card Body / Content Slot -->
  <div class="px-6 pb-6 pt-2 sm:px-8 sm:pb-8 flex-1">
    <ng-content></ng-content>
  </div>

  <!-- Optional Footer Slot -->
  <ng-content select="[card-footer], [footer]"></ng-content>
</div>
