<div class="mc-column-form {{field().config.classes}}">
    @for (subfield of field().config.fields; track $index) {
    <div class="{{ field().config?.containerFieldClass }} {{ subfield.config?.parentContainerClass }}">
        <mc-print-field [field]="subfield" [control]="group()!.get(subfield.key ?? '')" [group]="group()!"
            [eventObs]="eventObs()" />
    </div>
    }
</div>
