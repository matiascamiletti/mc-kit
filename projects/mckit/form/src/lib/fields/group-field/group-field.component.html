@if(newGroup()) {
<div [formGroup]="newGroup()!" class="mc-group-form {{field().config.classes}}">
  @for (subfield of field().config.fields; track $index) {
  <div class="{{ field().config?.containerFieldClass }} {{ subfield.config?.parentContainerClass }}">
    <mc-print-field [field]="subfield" [control]="newGroup()!.get(subfield.key ?? '')" [group]="newGroup()!"
      [eventObs]="eventObs()" />
  </div>
  }
</div>
}
